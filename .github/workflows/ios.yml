name: iOS build and tests

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "scripts/generate_ios_project.rb"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/generate_ios_project.rb"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ios:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 26.2
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          versions = []
          for path in glob.glob("/Applications/Xcode_*.app"):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$", path)
              if match:
                  versions.append((tuple(map(int, match[1].split("."))), path))
          if not versions:
              raise SystemExit("No stable Xcode installation found")
          versions = [version for version in versions if version[0][:2] == (26, 2)]
          if not versions:
              raise SystemExit("Xcode 26.2 is not installed; update the pinned toolchain deliberately")
          path = max(versions)[1] + "/Contents/Developer"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("DEVELOPER_DIR=" + path + "\n")
          print("Selected", path)
          PY
      - name: Validate project and property lists
        shell: bash
        run: |
          plutil -lint ios/ThriftForGood.xcodeproj/project.pbxproj ios/Sources/Info.plist ios/Sources/PrivacyInfo.xcprivacy
          xcodebuild -version
          xcodebuild -list -project ios/ThriftForGood.xcodeproj
      - name: Test connection and origin policies
        run: swift test --package-path ios
      - name: Compile native app for simulator
        shell: bash
        run: |
          mkdir -p ios/build
          xcodebuild build \
            -project ios/ThriftForGood.xcodeproj -target ThriftForGood \
            -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CONFIGURATION_BUILD_DIR="$PWD/ios/build/Simulator" \
            2>&1 | tee ios/build/native-compile.log
      - name: Verify device archive without signing
        shell: bash
        run: |
          xcodebuild archive \
            -project ios/ThriftForGood.xcodeproj -scheme ThriftForGood \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath ios/build/ThriftForGood-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/device-build.log
      - name: Package build artifacts
        shell: bash
        run: |
          if [ -d ios/build/Simulator/ThriftForGood.app ]; then
            ditto -c -k --keepParent ios/build/Simulator/ThriftForGood.app ios/build/ThriftForGood-Simulator.zip
          fi
          if [ -d ios/build/ThriftForGood-unsigned.xcarchive ]; then
            ditto -c -k --keepParent ios/build/ThriftForGood-unsigned.xcarchive ios/build/ThriftForGood-unsigned.xcarchive.zip
          fi
      - name: Publish compiled iOS builds
        uses: actions/upload-artifact@v7
        with:
          name: ThriftForGood-iOS-builds
          retention-days: 14
          if-no-files-found: error
          path: ios/build/*.zip
      - name: Select available iPhone and iPad simulators
        id: simulators
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          sdk = tuple(map(int, subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip().split(".")))
          versions = lambda key: tuple(map(int, re.findall(r"\d+", key)))
          runtimes = sorted((key for key in devices if ".iOS-" in key and versions(key) <= sdk), key=versions, reverse=True)
          for runtime in runtimes:
              phones = [device for device in devices[runtime] if device["name"].startswith("iPhone")]
              tablets = [device for device in devices[runtime] if device["name"].startswith("iPad")]
              if phones and tablets:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("phone=" + phones[0]["udid"] + "\n")
                      output.write("tablet=" + tablets[0]["udid"] + "\n")
                  print(runtime, phones[0]["name"], tablets[0]["name"])
                  break
          else:
              raise SystemExit("No runtime has both an iPhone and iPad simulator")
          PY
      - name: Build and test on iPhone
        timeout-minutes: 12
        env:
          PHONE: ${{ steps.simulators.outputs.phone }}
        shell: bash
        run: |
          mkdir -p ios/build
          xcrun simctl bootstatus "$PHONE" -b
          xcodebuild test \
            -project ios/ThriftForGood.xcodeproj -scheme ThriftForGood \
            -configuration Debug -derivedDataPath ios/DerivedData \
            -destination "platform=iOS Simulator,id=$PHONE" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath ios/TestResults-iPhone.xcresult \
            CODE_SIGN_IDENTITY=- 2>&1 | tee ios/build/iphone-tests.log
      - name: Shut down iPhone simulator
        if: always()
        env:
          PHONE: ${{ steps.simulators.outputs.phone }}
        run: if [ -n "$PHONE" ]; then xcrun simctl shutdown "$PHONE" || true; fi
      - name: Build and test on iPad
        timeout-minutes: 12
        env:
          TABLET: ${{ steps.simulators.outputs.tablet }}
        shell: bash
        run: |
          xcrun simctl bootstatus "$TABLET" -b
          xcodebuild test \
            -project ios/ThriftForGood.xcodeproj -scheme ThriftForGood \
            -configuration Debug -derivedDataPath ios/DerivedData \
            -destination "platform=iOS Simulator,id=$TABLET" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath ios/TestResults-iPad.xcresult \
            CODE_SIGN_IDENTITY=- 2>&1 | tee ios/build/ipad-tests.log
      - name: Shut down iPad simulator
        if: always()
        env:
          TABLET: ${{ steps.simulators.outputs.tablet }}
        run: if [ -n "$TABLET" ]; then xcrun simctl shutdown "$TABLET" || true; fi
      - name: Export simulator screenshots
        if: always()
        shell: bash
        run: |
          for device in iPhone iPad; do
            if [ -d "ios/TestResults-$device.xcresult" ]; then
              xcrun xcresulttool export attachments --path "ios/TestResults-$device.xcresult" --output-path "ios/build/screenshots/$device"
            fi
          done
      - name: Collect Xcode crash diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          output = Path("ios/build")
          output.mkdir(exist_ok=True)
          reports = sorted((Path.home() / "Library/Logs/DiagnosticReports").glob("xcodebuild*"), key=lambda path: path.stat().st_mtime, reverse=True)
          for report in reports[:3]:
              if report.is_file():
                  shutil.copy2(report, output / report.name)
                  print("Saved", report.name)
          PY
      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ThriftForGood-iOS-build-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            ios/build/*.log
            ios/build/*.zip
            ios/build/*.ips
            ios/build/screenshots
            ios/TestResults*.xcresult
